<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonew-lavado de autos</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <script  type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    {% load static %}
    <!-- Estilo de plantilla -->
    <link href="{% static "estilos/estilos.css" %}" rel="stylesheet" type="text/css" >
</head>
<body>
    <style>
    /*** estilos de homecrud ***/

.welcome-section {
    background-color: #f8f9fa;
    padding: 50px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
.welcome-title {
    font-size: 3rem;
    color: #343a40;
    margin-bottom: 20px;
    text-align: center;
}
.feature-list {
    list-style-type: none;
    padding: 0;
}
.feature-list li {
    background: #b2c9b2; 
    color: #333;
    margin: 10px 0;
    padding: 15px;
    border-radius: 5px;
    transition: background 0.3s;
}
.feature-list li:hover {
    background: #9fb89f;
}
.highlight {
    color: #4f0802; 
    font-weight: bold;
}
.feature-list a {
    display: block; 
    text-decoration: none;
    color: inherit; 
    height: 100%;
}
.feature-list a:hover {
    color: inherit;
}

.navbar {
    background: rgba(255,255,255,0.7); /* Blanco transparente */
    box-shadow: 0 2px 12px rgba(34, 49, 63, 0.10);
    padding: 1rem 2rem;
    border-radius: 0 0 18px 18px;
}
.navbar-brand {
    font-weight: bold;
    font-size: 2rem;
    color: #254d32 !important; /* Verde oscuro */
    letter-spacing: 2px;
}
.navbar-nav .nav-link {
    color: #254d32 !important; /* Verde oscuro */
    font-weight: 500;
    margin-right: 1rem;
    transition: color 0.2s, background 0.2s;
    border-radius: 8px;
    padding: 0.5rem 1rem;
}
.navbar-nav .nav-link.active, .navbar-nav .nav-link:hover {
    color: #fff !important;
    background: #254d32;
}
.profile-pic img {
    border: 3px solid #e9f5db;
    box-shadow: 0 2px 8px rgba(34, 49, 63, 0.12);
}
footer {
    background: rgba(255,255,255,0.7); /* Blanco transparente */
    color: #254d32; /* Verde oscuro */
    padding: 2rem 0 1rem 0;
    margin-top: 40px;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -2px 12px rgba(34, 49, 63, 0.10);
}
footer .bottom-bar {
    text-align: center;
    font-size: 1.1rem;
    color: #254d32; /* Verde oscuro */
}
footer a {
    color: #254d32;
    font-weight: bold;
    text-decoration: underline;
    transition: color 0.2s;
}
footer a:hover {
    color: #4f8a3f; /* Verde más claro al pasar el mouse */
}
    </style>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/homecrud">
                <img src="/static/img/logo.png" alt="Logo" style="width:48px; height:48px; border-radius:50%; margin-right:12px;">
                Autonew
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link {% if request.path == '/homecrud' %}active{% endif %}" href="/homecrud">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/usuarioscrud">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/citascrud">Citas pendientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/quejascrud">Quejas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/comentarioscrud">Comentarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/servicioscrud">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/empresascrud">Empresas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/citascomcrud">Citas completadas</a></li>
                </ul>
            </div>
        </div>
    </nav>
    {% block content  %}
    {% endblock  %}


    <footer>
        <div class="bottom-bar">
            <p>&copy; <a href="/homecrud">AUTONEW</a>, Todos los derechos reservados. Diseñado por <a href="/homecrud">Andres Forero</a></p>
        </div>
    </footer>
</body>
</html>
