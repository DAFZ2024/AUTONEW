
<style>
  @import url(https://fonts.bunny.net/css?family=bai-jamjuree:300,600,700);

*,
::before,
::after {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
:root {
	--bg-clr: black;
	--txt-clr: white;
}
body {
	font-family: system-ui;
	min-height: 100svh;
	display: grid;
	place-content: center;
	background-color: var(--bg-clr);
}
.layered-text {
	--txt-cta: rgb(2, 132, 199);

	position: fixed;
	inset: 0;
	margin: auto;
	display: grid;
	place-content: center;
	overflow: hidden;
	height: auto;
}
p {
	color: var(--txt-clr);
	font-family: "Bai Jamjuree", sans-serif;
	font-size: 1rem;
	font-weight: 300;
	line-height: 0.75;
}
p:first-child {
	text-indent: 35px;
	margin-bottom: -1px;
}
p.shadow {
	text-transform: uppercase;
	font-size: 6rem;
	position: relative;
	perspective: 100px;
	font-weight: 800;
	color: var(--txt-cta);
}
p.shadow::before {
	content: "PERSPECTIVE";
	position: absolute;
	top: 100%;
	left: 0;
	right: 0;
	scale: 1 -1;
	opacity: 0.25;
	color: white;
	z-index: -1;
	transform: rotateX(-40deg) scaleX(123%); /* magic numbers */
}
p.shadow::after {
	content: "";
	position: absolute;
	top: 100%;
	left: -50%;
	width: 200%;
	height: 150%;
	background: linear-gradient(to bottom, transparent, var(--bg-clr) 85%);
}


</style>
<div class="layered-text">
	<p>It's just a matter of</p>
	<p class="shadow">Perspective</p>
</div>
